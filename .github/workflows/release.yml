name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Run Test Suite Before Build
        run: |
          pytest -v

      - name: Build Standalone Windows Executable (.exe)
        run: |
          pyinstaller --noconsole --onefile --name "HeadRush_NAM_Studio" --paths src --hidden-import app_gui --hidden-import headrush_manager --hidden-import headrush_cli --collect-all customtkinter --distpath dist main.py --clean -y

      - name: Create ZIP Package
        run: |
          Compress-Archive -Path "dist\HeadRush_NAM_Studio.exe", "README.md", "LICENSE" -DestinationPath "dist\HeadRush_NAM_Studio_Windows_x64.zip"

      - name: Determine Release Tag
        id: tag_info
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "HeadRush NAM Studio Pro ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/HeadRush_NAM_Studio.exe
            dist/HeadRush_NAM_Studio_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
